name: CI

on:
  # Gate PRs, and the mainline itself after merge. Feature-branch pushes are
  # covered by their PR run, so this avoids the push+pull_request double-run.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the checkout. Overrides the repo
# default token scope so a compromised action can't write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (build + test)
    runs-on: ubuntu-latest
    # Safety net: the workspace suite runs in ~3 min; a stuck test (e.g. a
    # blocked global-singleton channel) must not burn the 6h GitHub default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # --- Hard gate: must pass. Catches compile regressions across the workspace. ---
      - name: Build
        run: cargo build --workspace --locked

      # --- Hard gate: the puffer-core unit suite — the crate holding the agent
      # runtime, command dispatch, permissions, and tools (where the real logic
      # and this branch's hermeticity fixes live). Green and deterministic on CI.
      #
      # Scoped to puffer-core on purpose: the wider workspace still carries
      # pre-existing non-deterministic tests in other crates (timing- and
      # ordering-sensitive) — the repo had no CI to keep them honest. The Build
      # step above already gates compilation of every crate; widen this to
      # `--workspace --lib` once the other crates' suites are cleaned up.
      # Integration targets (`--tests`) also stay ungated: some need a
      # terminal/tmux or the local workflow-runtime image. ---
      - name: Test (unit)
        run: cargo test -p puffer-core --lib --locked

      - name: Rustfmt (informational)
        run: cargo fmt --all --check
        continue-on-error: true

      - name: Clippy (informational)
        run: cargo clippy --workspace --all-targets --locked
        continue-on-error: true

  desktop:
    name: Desktop (build + check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/puffer-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/puffer-desktop/package-lock.json

      - name: Install deps
        run: npm ci

      # --- Hard gates: all currently green, so the desktop job is now a real
      # gate (previously every step was informational and could never fail). ---
      - name: Build (vite)
        run: npm run build

      - name: svelte-check
        run: npm run check

      # Pure-node config/asset assertions (no browser). The Playwright UI
      # suites are intentionally left out — they need browser binaries and a
      # running app, which is a separate CI investment.
      - name: Node tests
        run: |
          npm run test:tauri-config
          npm run test:sidebar-css
          npm run test:provider-visuals
