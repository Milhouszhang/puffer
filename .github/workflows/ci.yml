name: CI

on:
  # Gate PRs, and the mainline itself after merge. Feature-branch pushes are
  # covered by their PR run, so this avoids the push+pull_request double-run.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the checkout. Overrides the repo
# default token scope so a compromised action can't write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The `--tests` gate links 100+ integration-test binaries; with debug
  # symbols (the bulk of a debug binary) that `target/` exhausts the runner's
  # disk ("No space left on device"). Debug symbols are useless in CI, so drop
  # them — much smaller target/, faster linking, identical test behavior.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Runners ship tmux, so `require_tmux_or_skip` would RUN the TUI snapshot
  # tests — which are terminal-/timing-fragile in CI and fail deterministically.
  # Force them to skip; they still run locally for anyone who wants them.
  PUFFER_SKIP_TMUX_TESTS: "1"

jobs:
  rust:
    name: Rust (build + test)
    runs-on: ubuntu-latest
    # Safety net: the workspace suite runs in ~3 min; a stuck test (e.g. a
    # blocked global-singleton channel) must not burn the 6h GitHub default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # --- Hard gate: compile the whole workspace including test, integration,
      # example, and bench targets (`--all-targets`), so a compile break outside
      # production code (e.g. in a `crates/*/tests/` file) fails CI instead of
      # only tripping the informational clippy step. ---
      - name: Build
        run: cargo build --workspace --all-targets --locked

      # --- Hard gate: the whole-workspace test suite. `--tests` runs lib + bin
      # unit tests (incl. the bin-only `puffer-cli`) AND the integration test
      # targets under `crates/*/tests/`, which were previously compiled but
      # never executed. Runs in parallel — `ConfigPaths::discover` isolates
      # `user_config_dir` under the OS temp dir, so no race on the real
      # ~/.puffer and no need for `--test-threads=1`.
      #
      # Integration tests that need infra CI does not provide self-exclude:
      # tmux TUI tests self-skip when tmux is absent (`require_tmux_or_skip`),
      # and the few needing the workflow-runtime Docker image / a real browser
      # are `#[ignore]`d. Run the full set locally with tmux installed. ---
      - name: Test
        run: cargo test --workspace --tests --locked

      - name: Rustfmt (informational)
        run: cargo fmt --all --check
        continue-on-error: true

      # --- Hard gate: clippy's `correctness` group flags real defects (bad
      # comparisons, ignored #[must_use], always-true/false conditions, etc.)
      # at compile time. Only `correctness` is deny-level, so pre-existing
      # style/pedantic warnings stay informational and never block. ---
      - name: Clippy (correctness gate)
        run: cargo clippy --workspace --all-targets --locked -- -D clippy::correctness

  desktop:
    name: Desktop (build + check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/puffer-desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/puffer-desktop/package-lock.json

      - name: Install deps
        run: npm ci

      # --- Hard gates: all currently green, so the desktop job is now a real
      # gate (previously every step was informational and could never fail). ---
      - name: Build (vite)
        run: npm run build

      - name: svelte-check
        run: npm run check

      # Pure-node config/asset assertions (no browser). The Playwright UI
      # suites are intentionally left out — they need browser binaries and a
      # running app, which is a separate CI investment.
      - name: Node tests
        run: |
          npm run test:tauri-config
          npm run test:sidebar-css
          npm run test:provider-visuals

  desktop-backend:
    name: Desktop backend (cargo check)
    runs-on: ubuntu-latest
    # `apps/puffer-desktop/src-tauri` is a separate Cargo workspace that the
    # root `cargo build --workspace` skips, so the ~2400-line Tauri Rust
    # backend was never compiled in CI. `cargo check` (no link/bundle) is the
    # minimal gate that catches a backend compile break. Runs in parallel with
    # the other jobs, so no critical-path cost.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/puffer-desktop/src-tauri

      - name: cargo check (src-tauri)
        run: cargo check --manifest-path apps/puffer-desktop/src-tauri/Cargo.toml --locked
