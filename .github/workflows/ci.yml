name: CI

on:
  # Gate PRs, and the mainline itself after merge. Feature-branch pushes are
  # covered by their PR run, so this avoids the push+pull_request double-run.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the checkout. Overrides the repo
# default token scope so a compromised action can't write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (build + test)
    runs-on: ubuntu-latest
    # Safety net: the workspace suite runs in ~3 min; a stuck test (e.g. a
    # blocked global-singleton channel) must not burn the 6h GitHub default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # --- Hard gate: must pass. Catches compile regressions across the workspace. ---
      - name: Build
        run: cargo build --workspace --locked

      # --- Hard gate: the workspace unit-test suite. Portable and hermetic
      # (the previously-flagged non-hermetic failures — stale "12/12" catalog
      # assertions, real ~/.claude|~/.puffer reads, a leaked
      # PUFFER_OPENAI_WEBSOCKET env var, a subscriber test reaching the
      # subscription-manager singleton — are fixed).
      #
      # Integration test targets (`--tests`) are intentionally NOT gated: some
      # need a terminal/tmux (TUI snapshots) or external infra (the local
      # workflow-runtime container image), so they are not portable to a clean
      # runner. Run them locally with `cargo test --workspace --tests`. ---
      - name: Test (unit)
        run: cargo test --workspace --lib --locked

      - name: Rustfmt (informational)
        run: cargo fmt --all --check
        continue-on-error: true

      - name: Clippy (informational)
        run: cargo clippy --workspace --all-targets --locked
        continue-on-error: true

  desktop:
    name: Desktop (build + check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/puffer-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/puffer-desktop/package-lock.json

      - name: Install deps
        run: npm ci

      # --- Hard gates: all currently green, so the desktop job is now a real
      # gate (previously every step was informational and could never fail). ---
      - name: Build (vite)
        run: npm run build

      - name: svelte-check
        run: npm run check

      # Pure-node config/asset assertions (no browser). The Playwright UI
      # suites are intentionally left out — they need browser binaries and a
      # running app, which is a separate CI investment.
      - name: Node tests
        run: |
          npm run test:tauri-config
          npm run test:sidebar-css
          npm run test:provider-visuals
