name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (build + test)
    runs-on: ubuntu-latest
    # Safety net: the workspace suite runs in ~3 min; a stuck test (e.g. a
    # blocked global-singleton channel) must not burn the 6h GitHub default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # --- Hard gate: must pass. Catches compile regressions across the workspace. ---
      - name: Build
        run: cargo build --workspace

      # --- Hard gate: must pass. The previously-flagged pre-existing failures
      # (stale "12/12" connector-catalog assertions; non-hermetic tests leaking
      # process-global state — real ~/.claude and ~/.puffer reads, a leaked
      # PUFFER_OPENAI_WEBSOCKET env var, and a subscriber test that could reach
      # the shared subscription-manager singleton) have been fixed, so the unit
      # suite is now green and gating. ---
      - name: Test (unit)
        run: cargo test --workspace --lib

      - name: Rustfmt (informational)
        run: cargo fmt --all --check
        continue-on-error: true

      - name: Clippy (informational)
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

  desktop:
    name: Desktop (svelte-check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/puffer-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/puffer-desktop/package-lock.json

      - name: Install deps
        run: npm ci

      - name: svelte-check (informational)
        run: npm run check
        continue-on-error: true
