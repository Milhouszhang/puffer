name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # --- Hard gates: these must pass ---
      - name: Build
        run: cargo build --workspace

      - name: Test (unit)
        run: cargo test --workspace --lib

      # --- Informational: reported but do not fail the build ---
      - name: Rustfmt (informational)
        run: cargo fmt --all --check
        continue-on-error: true

      - name: Clippy (informational)
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

  desktop:
    name: Desktop (svelte-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/puffer-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci || npm install

      - name: svelte-check (informational)
        run: npm run check
        continue-on-error: true
